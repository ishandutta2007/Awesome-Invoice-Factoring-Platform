<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.04); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes waveAnim {
        0% { d: path('M0,280 Q300,240 600,280 T1200,260 L1200,360 L0,360 Z'); }
        50% { d: path('M0,260 Q300,290 600,250 T1200,280 L1200,360 L0,360 Z'); }
        100% { d: path('M0,280 Q300,240 600,280 T1200,260 L1200,360 L0,360 Z'); }
      }
      .anim-glow {
        animation: pulseGlow 6s infinite ease-in-out;
        transform-origin: center;
      }
      .anim-float1 {
        animation: floatSlow 7s infinite ease-in-out;
      }
      .anim-float2 {
        animation: floatReverse 8s infinite ease-in-out;
      }
      .anim-dash {
        stroke-dasharray: 8 6;
        animation: dashMove 12s linear infinite;
      }
      .anim-wave {
        animation: waveAnim 10s ease-in-out infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .sub-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Grid Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="90" r="140" fill="#6366f1" opacity="0.2" filter="url(#glow)" class="anim-glow" />
  <circle cx="1020" cy="180" r="160" fill="#0ea5e9" opacity="0.18" filter="url(#glow)" class="anim-glow" style="animation-delay: -3s;" />
  <circle cx="600" cy="300" r="120" fill="#10b981" opacity="0.12" filter="url(#glow)" class="anim-glow" style="animation-delay: -1.5s;" />

  <!-- Animated Wave Floor -->
  <path class="anim-wave" fill="url(#glowGrad)" opacity="0.15" d="M0,280 Q300,240 600,280 T1200,260 L1200,360 L0,360 Z" />

  <!-- Connection Flow Lines -->
  <g opacity="0.3" fill="none">
    <path d="M 120 280 C 300 200, 450 320, 650 220 S 950 140, 1100 200" stroke="#38bdf8" stroke-width="2" class="anim-dash" />
    <path d="M 80 160 C 250 100, 500 240, 750 120 S 1000 220, 1140 140" stroke="#a855f7" stroke-width="1.5" class="anim-dash" style="animation-direction: reverse; animation-duration: 16s;" />
  </g>

  <!-- Left Floating Card: Instant Liquidity / Factoring Metrics -->
  <g class="anim-float1" transform="translate(60, 75)">
    <rect width="210" height="190" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#subtleGlow)" />
    <rect x="18" y="20" width="34" height="34" rx="8" fill="#3b82f6" fill-opacity="0.2" />
    <text x="26" y="44" font-size="20" fill="#38bdf8">⚡</text>
    <text x="62" y="36" class="title-text" font-size="13" fill="#f8fafc">Receivables AR</text>
    <text x="62" y="50" class="sub-text" font-size="10" fill="#94a3b8">Instant Liquidity</text>

    <line x1="18" y1="74" x2="192" y2="74" stroke="#334155" stroke-width="1" />
    <text x="18" y="98" class="sub-text" font-size="11" fill="#94a3b8">Advance Rate</text>
    <text x="192" y="98" class="title-text" font-size="12" fill="#10b981" text-anchor="end">Up to 95%</text>
    <rect x="18" y="108" width="174" height="6" rx="3" fill="#1e293b" />
    <rect x="18" y="108" width="156" height="6" rx="3" fill="url(#primaryGrad)" />

    <text x="18" y="140" class="sub-text" font-size="11" fill="#94a3b8">Settlement Speed</text>
    <text x="192" y="140" class="title-text" font-size="12" fill="#38bdf8" text-anchor="end">&lt; 24 Hours</text>
    
    <text x="18" y="165" class="sub-text" font-size="10" fill="#64748b">Dynamic Discounting</text>
    <text x="192" y="165" class="title-text" font-size="10" fill="#a855f7" text-anchor="end">Active ✔</text>
  </g>

  <!-- Right Floating Card: Working Capital Hub -->
  <g class="anim-float2" transform="translate(930, 80)">
    <rect width="210" height="185" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#subtleGlow)" />
    <rect x="18" y="20" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.2" />
    <text x="26" y="44" font-size="20" fill="#10b981">💎</text>
    <text x="62" y="36" class="title-text" font-size="13" fill="#f8fafc">Supply Chain SCF</text>
    <text x="62" y="50" class="sub-text" font-size="10" fill="#94a3b8">Global Ecosystem</text>

    <line x1="18" y1="74" x2="192" y2="74" stroke="#334155" stroke-width="1" />
    
    <g transform="translate(18, 90)">
      <circle cx="6" cy="6" r="5" fill="#38bdf8" />
      <text x="20" y="10" class="sub-text" font-size="11" fill="#cbd5e1">B2B Net Terms BNPL</text>
    </g>
    <g transform="translate(18, 116)">
      <circle cx="6" cy="6" r="5" fill="#a855f7" />
      <text x="20" y="10" class="sub-text" font-size="11" fill="#cbd5e1">Reverse Factoring</text>
    </g>
    <g transform="translate(18, 142)">
      <circle cx="6" cy="6" r="5" fill="#10b981" />
      <text x="20" y="10" class="sub-text" font-size="11" fill="#cbd5e1">DeFi / On-Chain Protocols</text>
    </g>
  </g>

  <!-- Central Hero Content -->
  <g transform="translate(430, 48)">
    <rect width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#subtleGlow)" />
    <text x="28" y="21" class="sub-text" font-size="12" fill="#38bdf8" font-weight="700">CURATED FINTECH &amp; OPEN-SOURCE ECOSYSTEM</text>
  </g>

  <text x="600" y="132" text-anchor="middle" class="title-text" font-size="40" fill="#ffffff" letter-spacing="-0.5">
    Awesome Invoice Factoring
  </text>
  
  <text x="600" y="176" text-anchor="middle" class="title-text" font-size="34" fill="url(#primaryGrad)" letter-spacing="-0.5">
    &amp; Working Capital Platforms
  </text>

  <text x="600" y="216" text-anchor="middle" class="sub-text" font-size="15" fill="#94a3b8">
    Invoice Financing • Receivables Purchase • Supply Chain Finance • B2B Trade Credit
  </text>

  <g transform="translate(350, 252)">
    <rect width="500" height="42" rx="21" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
    <text x="60" y="26" class="sub-text" font-size="12" fill="#e2e8f0">🚀 SaaS Marketplaces</text>
    <text x="185" y="26" class="sub-text" font-size="12" fill="#64748b">•</text>
    <text x="220" y="26" class="sub-text" font-size="12" fill="#e2e8f0">⚡ Open-Source Primitives</text>
    <text x="375" y="26" class="sub-text" font-size="12" fill="#64748b">•</text>
    <text x="405" y="26" class="sub-text" font-size="12" fill="#e2e8f0">📊 Real Data</text>
  </g>
</svg>
